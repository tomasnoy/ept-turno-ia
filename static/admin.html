<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Panel del negocio</title>
<style>
  :root {
    --bg: #f4f1ec; --card: #ffffff; --ink: #1f2933; --muted: #62707e;
    --accent: #7a3e65; --accent-ink: #ffffff; --soft: #efe7ee; --line: #ddd5dc;
    --danger: #b3261e; --danger-soft: #fbeae9; --ok: #1e7a4c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17141a; --card: #221e26; --ink: #ece7ee; --muted: #a79fab;
      --accent: #c78ab3; --accent-ink: #1a1220; --soft: #2e2833; --line: #3b3441;
      --danger: #f2b8b5; --danger-soft: #3a2224; --ok: #7bd1a0;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 40px; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 18px 0 6px; gap: 12px; }
  h1 { margin: 0; font-size: 1.3rem; }
  h1 small { display: block; font-size: .85rem; font-weight: 400; color: var(--muted); }
  button { font: inherit; cursor: pointer; }
  button:disabled { opacity: .55; cursor: not-allowed; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; padding: 12px 18px; min-height: 48px; font-weight: 600; }
  .ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); border-radius: 10px; padding: 8px 14px; min-height: 44px; }
  .link { background: none; border: 0; color: var(--accent); text-decoration: underline; padding: 8px 4px; min-height: 44px; }
  input, select { font: inherit; padding: 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); min-height: 48px; }

  /* Login */
  #login { max-width: 420px; margin: 12vh auto 0; background: var(--card); padding: 24px; border-radius: 16px; border: 1px solid var(--line); }
  #login h1 { margin-bottom: 4px; }
  #login p { color: var(--muted); margin: 0 0 16px; }
  #login form { display: flex; flex-direction: column; gap: 12px; }
  label { font-size: .9rem; color: var(--muted); display: block; margin-bottom: 4px; }
  .error { color: var(--danger); margin: 0; min-height: 1.4em; }

  /* Tira de dias */
  .strip { display: flex; gap: 8px; overflow-x: auto; padding: 10px 2px 12px; scroll-snap-type: x proximity; }
  .day { flex: 0 0 auto; scroll-snap-align: start; min-width: 62px; padding: 8px 6px; text-align: center; border-radius: 12px;
         background: var(--card); border: 1.5px solid var(--line); color: var(--ink); }
  .day .wd { font-size: .75rem; color: var(--muted); text-transform: uppercase; }
  .day .num { font-size: 1.15rem; font-weight: 600; }
  .day .count { font-size: .78rem; color: var(--muted); min-height: 1.1em; }
  .day[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .day[aria-current="true"] .wd, .day[aria-current="true"] .count { color: var(--accent-ink); }
  .day.busy .count { font-weight: 700; color: var(--accent); }
  .day[aria-current="true"].busy .count { color: var(--accent-ink); }

  /* Barra del dia */
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin: 4px 0 10px; }
  .bar h2 { margin: 0; font-size: 1.2rem; }
  .nav { display: flex; gap: 6px; }
  .filters { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .filters label { margin: 0; display: flex; align-items: center; gap: 6px; color: var(--ink); font-size: .95rem; }
  .filters input[type=checkbox] { min-height: 0; width: 20px; height: 20px; }
  .summary { color: var(--muted); margin: 0 0 10px; }

  /* Tarjetas */
  ul.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; grid-template-columns: 78px 1fr; gap: 4px 14px; }
  .time { font-size: 1.25rem; font-weight: 700; }
  .time small { display: block; font-size: .8rem; font-weight: 400; color: var(--muted); }
  .who { font-weight: 600; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: .95rem; overflow-wrap: anywhere; }
  .meta a { color: var(--accent); }
  .badge { display: inline-block; font-size: .78rem; padding: 2px 8px; border-radius: 999px; background: var(--soft); color: var(--ink); margin-left: 6px; }
  .actions { grid-column: 2; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
  .card.cancelled { opacity: .7; background: var(--danger-soft); }
  .card.cancelled .who { text-decoration: line-through; }
  .danger { background: var(--danger); color: #fff; border: 0; border-radius: 10px; padding: 8px 14px; min-height: 44px; font-weight: 600; }
  @media (prefers-color-scheme: dark) { .danger { color: #1a1220; } }
  .empty { text-align: center; color: var(--muted); padding: 36px 12px; background: var(--card); border: 1px dashed var(--line); border-radius: 14px; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: .95rem; max-width: 90vw; }
  /* Lista de espera */
  .wait { margin-top: 26px; scroll-margin-top: 12px; }
  .wait h2 { margin: 0 0 4px; font-size: 1.2rem; }
  .wait > p { margin: 0 0 12px; color: var(--muted); font-size: .95rem; }
  .card.wait-card { grid-template-columns: 1fr; }
  .card.wait-card .actions { grid-column: 1; }
  .badge.ok { background: var(--ok); color: var(--bg); margin-left: 8px; }
  .offers { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .offer { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 8px 14px; min-height: 44px; font-weight: 600; }
  .card.hot { border-color: var(--ok); box-shadow: 0 0 0 2px var(--ok) inset; }
  .updated { font-size: .82rem; color: var(--muted); margin-top: 14px; text-align: right; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<section id="login" hidden>
  <h1>Panel del negocio</h1>
  <p>Ingresá tu clave para ver las reservas.</p>
  <form id="loginForm">
    <div><label for="key">Clave de acceso</label>
      <input id="key" type="password" autocomplete="current-password" required style="width:100%"></div>
    <p class="error" id="loginError" role="alert"></p>
    <button class="primary" type="submit">Ingresar</button>
  </form>
</section>

<div class="wrap" id="app" hidden>
  <header>
    <h1 id="business">Panel del negocio<small>Reservas de tus clientes</small></h1>
    <button class="ghost" id="logout" type="button">Salir</button>
  </header>

  <nav class="strip" id="strip" aria-label="Próximos días"></nav>

  <div class="bar">
    <h2 id="dayTitle"></h2>
    <div class="nav">
      <button class="ghost" id="prev" type="button" aria-label="Día anterior">‹</button>
      <button class="ghost" id="today" type="button">Hoy</button>
      <button class="ghost" id="next" type="button" aria-label="Día siguiente">›</button>
    </div>
  </div>

  <div class="filters">
    <select id="pro" aria-label="Filtrar por profesional"><option value="">Todos los profesionales</option></select>
    <label><input type="checkbox" id="showCancelled"> Mostrar cancelados</label>
    <button class="link" id="goWait" type="button">Lista de espera</button>
  </div>

  <p class="summary" id="summary" aria-live="polite"></p>
  <ul class="list" id="list"></ul>
  <section class="wait" id="waitSection" aria-labelledby="waitTitle">
    <h2 id="waitTitle">Lista de espera <span id="waitCount"></span></h2>
    <p>Clientes que no encontraron lugar. Se ordenan por llegada: ofrecé primero al que lleva más tiempo esperando.</p>
    <ul class="list" id="waitList"></ul>
  </section>
  <p class="updated" id="updated"></p>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
  const $ = (id) => document.getElementById(id);
  const store = { get: () => { try { return sessionStorage.getItem("adminKey"); } catch (_) { return null; } },
                  set: (v) => { try { sessionStorage.setItem("adminKey", v); } catch (_) {} },
                  clear: () => { try { sessionStorage.removeItem("adminKey"); } catch (_) {} } };
  let key = store.get();
  let day = null, today = null, data = null, timer = null, waiting = [];

  function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; }
  const fmt = (iso, opts) => new Date(iso + "T12:00:00").toLocaleDateString("es-AR", opts);
  const hhmm = (iso) => iso.slice(11, 16);

  function toast(text) {
    const t = $("toast"); t.textContent = text; t.hidden = false;
    clearTimeout(toast.h); toast.h = setTimeout(() => (t.hidden = true), 3500);
  }

  async function api(path, method = "GET", payload) {
    const headers = { "X-Admin-Token": key || "" };
    if (payload) headers["Content-Type"] = "application/json";
    const resp = await fetch(path, { method, headers, body: payload ? JSON.stringify(payload) : undefined });
    let body = {};
    try { body = await resp.json(); } catch (_) {}
    if (!resp.ok) { const e = new Error(body.detail || "Ocurrió un error. Probá de nuevo."); e.status = resp.status; throw e; }
    return body;
  }

  function showLogin(msg = "") {
    clearInterval(timer); store.clear(); key = null;
    $("app").hidden = true; $("login").hidden = false; $("loginError").textContent = msg; $("key").value = ""; $("key").focus();
  }

  async function load(target) {
    try {
      data = await api("/api/admin/agenda" + (target ? `?day=${target}` : ""));
    } catch (err) {
      if (err.status === 401) return showLogin("La sesión venció o la clave es incorrecta.");
      if (err.status === 429 || err.status === 503) return showLogin(err.message);
      toast(err.message); return;
    }
    day = data.day; today = data.upcoming[0].day;
    $("login").hidden = true; $("app").hidden = false;
    render();
    await loadWaitlist();
  }

  async function loadWaitlist() {
    try { waiting = (await api("/api/admin/waitlist")).entries; } catch (_) { /* la agenda sigue funcionando */ }
    renderWaitlist();
  }

  function render() {
    // Tira de proximos dias (si el dia elegido esta fuera de la tira, simplemente no se marca ninguno)
    const strip = $("strip"); strip.replaceChildren();
    data.upcoming.forEach((u) => {
      const b = el("button", "day" + (u.count ? " busy" : ""));
      b.type = "button";
      b.setAttribute("aria-label", `${fmt(u.day, { weekday: "long", day: "numeric", month: "long" })}: ${u.count} ${u.count === 1 ? "turno" : "turnos"}`);
      if (u.day === day) b.setAttribute("aria-current", "true");
      b.append(el("div", "wd", fmt(u.day, { weekday: "short" }).replace(".", "")), el("div", "num", fmt(u.day, { day: "numeric" })),
               el("div", "count", u.count ? `${u.count} ${u.count === 1 ? "turno" : "turnos"}` : "libre"));
      b.addEventListener("click", () => load(u.day));
      strip.appendChild(b);
    });

    const long = fmt(day, { weekday: "long", day: "numeric", month: "long" });
    $("dayTitle").textContent = day === today ? `Hoy · ${long}` : long.charAt(0).toUpperCase() + long.slice(1);

    // Filtro de profesionales (se arma con los que aparecen en los turnos + el que estaba elegido)
    const sel = $("pro"), current = sel.value;
    const names = [...new Set(data.appointments.map((a) => a.professional))].sort();
    if (current && !names.includes(current)) names.push(current);
    sel.replaceChildren(new Option("Todos los profesionales", ""), ...names.map((n) => new Option(n, n)));
    sel.value = current;

    const showCancelled = $("showCancelled").checked;
    const shown = data.appointments.filter((a) => (showCancelled || a.status === "confirmed") && (!sel.value || a.professional === sel.value));
    const confirmed = data.appointments.filter((a) => a.status === "confirmed").length;
    const cancelled = data.appointments.length - confirmed;
    $("summary").textContent = confirmed
      ? `${confirmed} ${confirmed === 1 ? "turno confirmado" : "turnos confirmados"}` + (cancelled ? ` · ${cancelled} cancelado${cancelled === 1 ? "" : "s"}` : "")
      : "No hay turnos confirmados para este día.";

    const list = $("list"); list.replaceChildren();
    if (!shown.length) {
      const empty = el("li", "empty", data.appointments.length ? "No hay turnos con este filtro." : "Todavía no hay reservas para este día.");
      list.appendChild(empty);
    }
    shown.forEach((a) => list.appendChild(card(a)));
    $("updated").textContent = "Actualizado a las " + new Date().toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" });
  }

  function card(a) {
    const li = el("li", "card" + (a.status === "cancelled" ? " cancelled" : ""));
    const time = el("div", "time", hhmm(a.start));
    time.appendChild(el("small", "", "hasta " + hhmm(a.end)));
    const info = el("div");
    const who = el("div", "who", a.customer);
    if (a.status === "cancelled") who.appendChild(el("span", "badge", "Cancelado"));
    const meta = el("div", "meta", `${a.service} · con ${a.professional}`);
    info.append(who, meta);
    if (a.phone) {
      const phone = el("div", "meta");
      const link = el("a", "", a.phone); link.href = "tel:" + a.phone.replace(/[^0-9+]/g, "");
      phone.append("Tel: ", link); info.appendChild(phone);
    }
    li.append(time, info);
    if (a.status === "confirmed") li.appendChild(cancelControls(a));
    return li;
  }

  // Paso de confirmacion en el lugar: evita acciones por error sin abrir ventanas emergentes.
  function confirmStep(box, question, yesText, yesClass, action) {
    const before = [...box.childNodes];
    box.dataset.confirming = "1";
    box.replaceChildren(el("span", "meta", question));
    const yes = el("button", yesClass, yesText); yes.type = "button";
    const no = el("button", "ghost", "No, volver"); no.type = "button";
    no.addEventListener("click", () => { delete box.dataset.confirming; box.replaceChildren(...before); });
    yes.addEventListener("click", async () => {
      yes.disabled = no.disabled = true; yes.textContent = "Un momento…";
      try { await action(); } catch (err) { toast(err.message); }
      delete box.dataset.confirming;
      load(day);
    });
    box.append(yes, no);
  }

  function cancelControls(a) {
    const box = el("div", "actions");
    const start = el("button", "link", "Cancelar turno"); start.type = "button";
    start.addEventListener("click", () => confirmStep(box, "¿Cancelar este turno?", "Sí, cancelar", "danger", async () => {
      const r = await api(`/api/admin/appointments/${a.id}/cancel`, "POST");
      if (r.waitlist_matches.length) {
        const names = r.waitlist_matches.map((m) => m.customer).join(", ");
        toast(`Turno cancelado. Podés ofrecer el lugar a: ${names}`);
        setTimeout(() => $("waitSection").scrollIntoView({ behavior: "smooth" }), 400);
      } else {
        toast("Turno cancelado. El horario quedó libre.");
      }
    }));
    box.appendChild(start);
    return box;
  }

  const PARTS = { any: "cualquier horario", morning: "a la mañana", afternoon: "a la tarde", evening: "a la noche" };

  function renderWaitlist() {
    $("waitCount").textContent = waiting.length ? `(${waiting.length})` : "";
    $("goWait").textContent = waiting.length ? `Lista de espera (${waiting.length})` : "Lista de espera";
    const list = $("waitList"); list.replaceChildren();
    if (!waiting.length) {
      list.appendChild(el("li", "empty", "Nadie en lista de espera. Cuando un cliente no encuentre lugar, va a aparecer acá."));
      return;
    }
    waiting.forEach((w) => list.appendChild(waitCard(w)));
  }

  function waitCard(w) {
    const li = el("li", "card wait-card" + (w.offers.length ? " hot" : ""));
    const info = el("div");
    const who = el("div", "who", w.customer);
    if (w.offers.length) who.appendChild(el("span", "badge ok", "Hay lugar"));
    const when = fmt(w.day, { weekday: "long", day: "numeric", month: "long" });
    info.append(who, el("div", "meta", `${w.service} · ${when} · ${PARTS[w.part_of_day] || w.part_of_day}` + (w.professional ? ` · con ${w.professional}` : "")));
    if (w.phone) {
      const phone = el("div", "meta"); const link = el("a", "", w.phone); link.href = "tel:" + w.phone.replace(/[^0-9+]/g, "");
      phone.append("Tel: ", link, ` · anotado/a el ${fmt(w.created_at.slice(0, 10), { day: "numeric", month: "numeric" })}`);
      info.appendChild(phone);
    }
    li.appendChild(info);

    const box = el("div", "actions");
    if (w.offers.length) {
      const offers = el("div", "offers");
      w.offers.forEach((o) => {
        const b = el("button", "offer", `Dar turno ${o.label}`); b.type = "button";
        b.addEventListener("click", () => confirmStep(box, `¿Dar el turno de ${o.label} a ${w.customer}?`, "Sí, dar turno", "primary", async () => {
          await api(`/api/admin/waitlist/${w.id}/book`, "POST", { professional_id: o.professional_id, start: o.start });
          toast(`Turno asignado a ${w.customer}. Avisale por teléfono.`);
        }));
        offers.appendChild(b);
      });
      box.appendChild(offers);
    } else {
      box.appendChild(el("span", "meta", "Todavía no hay lugar para esta persona."));
    }
    const remove = el("button", "link", "Quitar de la lista"); remove.type = "button";
    remove.addEventListener("click", () => confirmStep(box, `¿Quitar a ${w.customer} de la lista?`, "Sí, quitar", "danger", async () => {
      await api(`/api/admin/waitlist/${w.id}/remove`, "POST"); toast("Quitado de la lista de espera.");
    }));
    box.appendChild(remove);
    li.appendChild(box);
    return li;
  }

  function shift(delta) {
    const d = new Date(day + "T12:00:00"); d.setDate(d.getDate() + delta);
    load(d.toISOString().slice(0, 10));
  }

  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault(); key = $("key").value; $("loginError").textContent = "";
    try { await api("/api/admin/check"); store.set(key); start(); }
    catch (err) { key = null; $("loginError").textContent = err.message; }
  });
  $("logout").addEventListener("click", () => showLogin());
  $("prev").addEventListener("click", () => shift(-1));
  $("next").addEventListener("click", () => shift(1));
  $("today").addEventListener("click", () => load(today));
  $("pro").addEventListener("change", render);
  $("showCancelled").addEventListener("change", render);
  $("goWait").addEventListener("click", () => $("waitSection").scrollIntoView({ behavior: "smooth" }));

  function start() {
    load();
    clearInterval(timer);
    timer = setInterval(() => { if (!document.hidden && day && !document.querySelector('[data-confirming]')) load(day); }, 60000);  // nuevas reservas sin recargar
  }

  fetch("/api/business").then((r) => r.json()).then((b) => {
    $("business").firstChild.textContent = b.name; document.title = `Panel · ${b.name}`;
  }).catch(() => {});

  if (key) start(); else showLogin();
</script>
</body>
</html>
