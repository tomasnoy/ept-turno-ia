<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reservá tu turno</title>
<style>
  :root {
    --bg: #f4f1ec; --card: #ffffff; --ink: #1f2933; --muted: #62707e;
    --accent: #7a3e65; --accent-ink: #ffffff; --bot: #efe7ee; --user: #7a3e65;
    --line: #ddd5dc; --danger: #b3261e; --ok: #1e7a4c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17141a; --card: #221e26; --ink: #ece7ee; --muted: #a79fab;
      --accent: #c78ab3; --accent-ink: #1a1220; --bot: #2e2833; --user: #c78ab3;
      --line: #3b3441; --danger: #f2b8b5; --ok: #7bd1a0;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .app { max-width: 640px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column;
         padding: 0 16px; }
  header { padding: 20px 0 8px; display: flex; align-items: center; gap: 12px; }
  header .logo { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; flex: 0 0 auto; }
  h1 { margin: 0; font-size: 1.35rem; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: .95rem; }
  #log { flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 12px 0; }
  .msg { max-width: 88%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bot { background: var(--bot); align-self: flex-start; border-bottom-left-radius: 4px; }
  .user { background: var(--user); color: var(--accent-ink); align-self: flex-end; border-bottom-right-radius: 4px; }
  .status { color: var(--muted); font-style: italic; }
  .error { color: var(--danger); }
  .success { border: 2px solid var(--ok); background: var(--card); }
  .options { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  button { font: inherit; cursor: pointer; }
  .option, .chip { text-align: left; background: var(--card); color: var(--ink);
                   border: 1.5px solid var(--accent); border-radius: 12px; padding: 12px 14px; min-height: 48px; }
  .option:hover, .chip:hover { background: var(--bot); }
  .primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px;
             padding: 12px 18px; min-height: 48px; font-weight: 600; }
  .secondary { background: transparent; color: var(--accent); border: 0; padding: 12px 8px; min-height: 48px; text-decoration: underline; }
  button:disabled { opacity: .55; cursor: not-allowed; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .waitlist { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .waitlist p { margin: 0 0 8px; font-size: .95rem; }
  .waitlist .option { border-style: dashed; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 10px; }
  .chips[hidden] { display: none; }
  .chip { border-radius: 999px; padding: 8px 14px; min-height: 40px; font-size: .95rem; }
  .calendar { margin-top: 10px; }
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .cal-month-label { font-weight: 600; text-transform: capitalize; }
  .cal-nav-btn { background: var(--card); color: var(--accent); border: 1.5px solid var(--accent); border-radius: 10px;
                 min-width: 40px; min-height: 40px; font-size: 1.1rem; line-height: 1; }
  .cal-nav-btn:disabled { opacity: .35; cursor: not-allowed; border-color: var(--line); color: var(--muted); }
  .cal-head { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center;
              font-size: .8rem; color: var(--muted); margin-bottom: 4px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; transition: opacity .15s; }
  .cal-grid.loading { opacity: .5; pointer-events: none; }
  .cal-day { aspect-ratio: 1; min-height: 40px; border-radius: 10px; border: 1.5px solid var(--line);
             background: var(--card); color: var(--ink); padding: 0; }
  .cal-day:not(:disabled):hover { border-color: var(--accent); }
  .cal-day.selected { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .cal-day:disabled { opacity: .35; cursor: not-allowed; border-style: dashed; }
  .cal-empty { visibility: hidden; }
  .cal-times { margin-top: 12px; }
  .options.times { flex-direction: row; flex-wrap: wrap; }
  .time-slot { min-width: 84px; text-align: center; }
  .time-slot.selected { background: var(--accent); color: var(--accent-ink); }
  form.confirm { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
  label { font-size: .9rem; color: var(--muted); display: block; margin-bottom: 4px; }
  input { font: inherit; width: 100%; padding: 12px; border-radius: 10px; border: 1.5px solid var(--line);
          background: var(--card); color: var(--ink); min-height: 48px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #composer { position: sticky; bottom: 0; background: var(--bg); padding: 10px 0 16px; display: flex; gap: 8px; }
  #composer input { flex: 1; }
  .hint { font-size: .85rem; color: var(--muted); margin: 0; }
</style>
</head>
<body>
<div class="app">
  <header>
    <img id="logo" class="logo" alt="" hidden>
    <div>
      <h1 id="business">Reservá tu turno</h1>
      <p>Escribí qué necesitás con tus palabras y te muestro los horarios libres.</p>
    </div>
  </header>

  <main id="log" aria-live="polite" aria-label="Conversación"></main>

  <div id="chips" class="chips" aria-label="Ejemplos para empezar"></div>

  <form id="composer" autocomplete="off">
    <input id="text" type="text" maxlength="500" placeholder="Escribí qué necesitás y para cuándo"
           aria-label="Tu mensaje" required>
    <button class="primary" id="send" type="submit">Enviar</button>
  </form>
</div>

<script>
  const log = document.getElementById("log");
  const chips = document.getElementById("chips");
  const form = document.getElementById("composer");
  const input = document.getElementById("text");
  const sendBtn = document.getElementById("send");
  let context = {};
  let busy = false;

  const SLUG = decodeURIComponent(location.pathname.replace(/^\/b\//, "").replace(/\/$/, "")) || "demo";
  const API_BASE = `/api/b/${SLUG}`;

  const WEEKDAYS_ES = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
  const MESES_ES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio",
                     "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
  const MAX_MONTHS_AHEAD = 3;
  // Se muestran si el negocio no cargo ejemplos propios, o si /business no respondio.
  const FALLBACK_PROMPTS = [
    "Quiero reservar un turno para mañana",
    "¿Qué turnos hay para el viernes?",
    "Necesito un turno para el sábado a la mañana",
  ];
  function dayLabel(iso) {
    const d = new Date(`${iso}T00:00:00`);
    const dd = String(d.getDate()).padStart(2, "0");
    const mm = String(d.getMonth() + 1).padStart(2, "0");
    return `${WEEKDAYS_ES[d.getDay()]} ${dd}/${mm}`;
  }

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }
  function add(node) { log.appendChild(node); node.scrollIntoView({ block: "end", behavior: "smooth" }); return node; }
  const say = (text, cls = "") => add(el("div", `msg bot ${cls}`.trim(), text));

  function setBusy(value) {
    busy = value; sendBtn.disabled = value; input.disabled = value;
    if (!value) input.focus();
  }

  async function api(path, body) {
    const resp = await fetch(path, {
      method: body ? "POST" : "GET",
      headers: body ? { "Content-Type": "application/json" } : undefined,
      body: body ? JSON.stringify(body) : undefined,
    });
    let data = {};
    try { data = await resp.json(); } catch (_) {}
    if (!resp.ok) {
      const detail = Array.isArray(data.detail) ? "Revisá los datos que ingresaste." : data.detail;
      const err = new Error(detail || "Ocurrió un error. Probá de nuevo.");
      err.status = resp.status;
      throw err;
    }
    return data;
  }

  async function send(text) {
    if (busy || !text.trim()) return;
    chips.hidden = true;
    add(el("div", "msg user", text));
    input.value = "";
    setBusy(true);
    const status = say("Buscando horarios…", "status");
    try {
      const data = await api(`${API_BASE}/chat`, { message: text, context });
      status.remove();
      context = data.context;
      const bubble = say(data.reply);
      if (data.calendar_days.length || data.selected_day) renderCalendar(bubble, data);
      if (data.waitlist) renderWaitlistOffer(bubble, data.waitlist, !!data.options.length);
    } catch (err) {
      status.remove();
      say(err.message, "error");
    } finally {
      setBusy(false);
    }
  }

  function renderCalendar(bubble, data) {
    const wrap = el("div", "calendar");
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const initial = data.selected_day ? new Date(`${data.selected_day}T00:00:00`) : today;
    const state = {
      year: initial.getFullYear(), month: initial.getMonth(), // month: 0-indexado
      selected: data.selected_day || null, ctx: data.context, avail: new Set(), cache: {},
    };

    const nav = el("div", "cal-nav");
    const prevBtn = el("button", "cal-nav-btn", "‹"); prevBtn.type = "button"; prevBtn.setAttribute("aria-label", "Mes anterior");
    const monthLabel = el("span", "cal-month-label");
    const nextBtn = el("button", "cal-nav-btn", "›"); nextBtn.type = "button"; nextBtn.setAttribute("aria-label", "Mes siguiente");
    nav.append(prevBtn, monthLabel, nextBtn);

    const head = el("div", "cal-head");
    ["L", "M", "M", "J", "V", "S", "D"].forEach((l) => head.appendChild(el("span", "", l)));

    const grid = el("div", "cal-grid");
    const timesBox = el("div", "cal-times");
    wrap.append(nav, head, grid, timesBox);
    bubble.appendChild(wrap);

    async function loadMonth(year, month) {
      const key = `${year}-${String(month + 1).padStart(2, "0")}`;
      if (state.cache[key]) { state.avail = state.cache[key]; return; }
      const params = new URLSearchParams({ service_id: state.ctx.service_id, month: key });
      if (state.ctx.professional_id) params.set("professional_id", state.ctx.professional_id);
      try {
        const res = await api(`${API_BASE}/availability?${params.toString()}`);
        state.avail = state.cache[key] = new Set(res.days);
      } catch (_) {
        state.avail = new Set();
      }
    }

    function drawGrid() {
      monthLabel.textContent = `${MESES_ES[state.month]} ${state.year}`;
      grid.replaceChildren();
      const firstWeekday = (new Date(state.year, state.month, 1).getDay() + 6) % 7; // semana arranca lunes
      const daysInMonth = new Date(state.year, state.month + 1, 0).getDate();
      for (let i = 0; i < firstWeekday; i++) grid.appendChild(el("span", "cal-empty"));
      for (let d = 1; d <= daysInMonth; d++) {
        const dt = new Date(state.year, state.month, d);
        const iso = `${state.year}-${String(state.month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
        const btn = el("button", "cal-day", String(d));
        btn.type = "button";
        btn.dataset.iso = iso;
        if (dt < today || !state.avail.has(iso)) btn.disabled = true;
        if (iso === state.selected) btn.classList.add("selected");
        btn.addEventListener("click", () => {
          state.selected = iso;
          grid.querySelectorAll(".cal-day").forEach((b) => b.classList.toggle("selected", b.dataset.iso === iso));
          selectDay(iso, timesBox, state.ctx);
        });
        grid.appendChild(btn);
      }
      const monthsAhead = (state.year - today.getFullYear()) * 12 + (state.month - today.getMonth());
      prevBtn.disabled = monthsAhead <= 0;
      nextBtn.disabled = monthsAhead >= MAX_MONTHS_AHEAD;
    }

    async function goTo(year, month) {
      prevBtn.disabled = nextBtn.disabled = true;
      grid.classList.add("loading");
      await loadMonth(year, month);
      state.year = year; state.month = month;
      grid.classList.remove("loading");
      drawGrid();
    }

    prevBtn.addEventListener("click", () => {
      let m = state.month - 1, y = state.year;
      if (m < 0) { m = 11; y -= 1; }
      goTo(y, m);
    });
    nextBtn.addEventListener("click", () => {
      let m = state.month + 1, y = state.year;
      if (m > 11) { m = 0; y += 1; }
      goTo(y, m);
    });

    prevBtn.disabled = nextBtn.disabled = true;
    loadMonth(state.year, state.month).then(drawGrid);

    if (data.selected_day) {
      renderTimes(timesBox, data.options, data.selected_time, data.selected_day);
    } else if (data.calendar_days.length) {
      timesBox.appendChild(el("p", "hint", "Elegí un día para ver los horarios."));
    } else {
      timesBox.appendChild(el("p", "hint", "No hay horarios disponibles próximamente."));
    }
  }

  async function selectDay(iso, timesBox, ctx) {
    timesBox.innerHTML = "";
    timesBox.appendChild(el("div", "status", "Buscando horarios…"));
    try {
      const params = new URLSearchParams({ service_id: ctx.service_id, day: iso });
      if (ctx.professional_id) params.set("professional_id", ctx.professional_id);
      const data = await api(`${API_BASE}/slots?${params.toString()}`);
      timesBox.innerHTML = "";
      renderTimes(timesBox, data.options, null, iso);
    } catch (err) {
      timesBox.innerHTML = "";
      timesBox.appendChild(el("div", "msg error", err.message));
    }
  }

  function renderTimes(container, options, selectedTime, dayIso) {
    container.innerHTML = "";
    if (!options.length) {
      container.appendChild(el("p", "hint", "No hay horarios libres ese día."));
      return;
    }
    const multiPro = new Set(options.map((o) => o.professional_id)).size > 1;
    const box = el("div", "options times");
    options.forEach((opt) => {
      const hm = opt.start.slice(11, 16);
      const text = multiPro ? `${hm} · ${opt.professional_name}` : hm;
      const b = el("button", "option time-slot", text);
      b.type = "button";
      if (selectedTime && hm === selectedTime) b.classList.add("selected");
      b.addEventListener("click", () => {
        box.querySelectorAll("button").forEach((x) => (x.disabled = true));
        const label = `${dayLabel(dayIso || opt.start.slice(0, 10))} a las ${hm} con ${opt.professional_name}`;
        askDetails({ professional_id: opt.professional_id, start: opt.start, label });
      });
      box.appendChild(b);
    });
    container.appendChild(box);
  }

  function renderWaitlistOffer(bubble, offer, hasOptions) {
    const box = el("div", "waitlist");
    box.appendChild(el("p", "", hasOptions ? "¿No te sirve ninguno?" : "¿Querés que te avisemos si se libera un lugar?"));
    const b = el("button", "option", `Anotarme en la lista de espera · ${offer.label}`);
    b.type = "button";
    b.addEventListener("click", () => { b.disabled = true; askWaitlist(offer); });
    box.appendChild(b);
    bubble.appendChild(box);
  }

  function askWaitlist(offer) {
    add(el("div", "msg user", `Anotarme en la lista de espera · ${offer.label}`));
    const bubble = say("Dejame tus datos. Si se libera un lugar, el negocio te va a contactar por teléfono:");
    const f = el("form", "confirm");
    f.innerHTML = `
      <div><label for="wn">Tu nombre</label><input id="wn" name="name" required minlength="2" maxlength="80" autocomplete="name"></div>
      <div><label for="wp">Tu teléfono (para avisarte)</label><input id="wp" name="phone" type="tel" required minlength="6" maxlength="20" autocomplete="tel"></div>
      <div class="row"><button class="primary" type="submit">Anotarme</button>
      <button class="secondary" type="button" id="wback">No, gracias</button></div>`;
    bubble.appendChild(f);
    f.querySelector("input").focus();
    f.querySelector("#wback").addEventListener("click", () => { f.remove(); say("Sin problema. Si querés probar otro día u horario, escribime."); input.focus(); });
    f.addEventListener("submit", async (e) => {
      e.preventDefault();
      const submit = f.querySelector("button[type=submit]");
      submit.disabled = true; submit.textContent = "Anotando…";
      try {
        const data = await api(`${API_BASE}/waitlist`, {
          customer_name: f.name.value, phone: f.phone.value,
          service_id: offer.service_id, professional_id: offer.professional_id,
          day: offer.day, part_of_day: offer.part_of_day,
        });
        f.remove();
        say(data.summary, "success");
      } catch (err) {
        submit.disabled = false; submit.textContent = "Anotarme";
        say(err.message, "error");
      }
    });
  }

  function askDetails(opt) {
    add(el("div", "msg user", opt.label));
    const bubble = say("Casi listo. Dejame tus datos para confirmar el turno:");
    const f = el("form", "confirm");
    f.innerHTML = `
      <div><label for="cn">Tu nombre</label><input id="cn" name="name" required minlength="2" maxlength="80" autocomplete="name"></div>
      <div><label for="cp">Teléfono (opcional, para reconocerte la próxima vez)</label><input id="cp" name="phone" type="tel" maxlength="20" autocomplete="tel"></div>
      <div class="row"><button class="primary" type="submit">Confirmar turno</button>
      <button class="secondary" type="button" id="back">Elegir otro horario</button></div>`;
    bubble.appendChild(f);
    f.querySelector("input").focus();
    f.querySelector("#back").addEventListener("click", () => {
      f.remove();
      say("Sin problema. Escribime otro día u horario y te muestro más opciones.");
      input.focus();
    });
    f.addEventListener("submit", async (e) => {
      e.preventDefault();
      const submit = f.querySelector("button[type=submit]");
      submit.disabled = true; submit.textContent = "Confirmando…";
      try {
        const data = await api(`${API_BASE}/book`, {
          customer_name: f.name.value, phone: f.phone.value || null,
          professional_id: opt.professional_id, service_id: context.service_id, start: opt.start,
        });
        f.remove();
        context = {};
        const done = say(data.summary + "\n¡Te esperamos!", "success");
        const again = el("button", "secondary", "Reservar otro turno");
        again.type = "button";
        again.addEventListener("click", () => { again.remove(); say("¿Qué otro turno querés reservar?"); input.focus(); });
        done.appendChild(again);
      } catch (err) {
        submit.disabled = false; submit.textContent = "Confirmar turno";
        say(err.message, "error");
        if (err.status === 409) { f.remove(); say("Escribime de nuevo el día que querés y te muestro horarios actualizados."); }
      }
    });
  }

  form.addEventListener("submit", (e) => { e.preventDefault(); send(input.value); });

  function renderChips(prompts) {
    prompts.forEach((t) => {
      const c = el("button", "chip", t);
      c.type = "button";
      c.addEventListener("click", () => send(t));
      chips.appendChild(c);
    });
  }

  api(`${API_BASE}/business`).then((b) => {
    document.getElementById("business").textContent = b.name;
    document.title = `Reservá tu turno · ${b.name}`;
    if (b.color_primary) document.documentElement.style.setProperty("--accent", b.color_primary);
    if (b.logo_url) {
      const logo = document.getElementById("logo");
      logo.src = b.logo_url; logo.alt = b.name; logo.hidden = false;
    }
    const prompts = b.example_prompts && b.example_prompts.length ? b.example_prompts : FALLBACK_PROMPTS;
    renderChips(prompts);
    input.placeholder = `Ej: ${prompts[0]}`;
    say(b.welcome_message);
  }).catch((err) => {
    // Sin datos del negocio no hay ejemplos propios, pero igual dejamos algo para empezar
    // si el problema fue de red y no porque el negocio no existe.
    if (err.status !== 404) renderChips(FALLBACK_PROMPTS);
    say(err.status === 404 ? "Este negocio no existe o cambió de dirección." : "No pude conectarme con el servidor. Recargá la página en unos segundos.", "error");
  });
</script>
</body>
</html>
